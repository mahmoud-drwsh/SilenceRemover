# Browser tests (Playwright for Python) for the Media Manager pages.
# The runner (tests/integration/run_isolated_fresh.sh) always adds this file.
# Run the tests with the "browser" flow. The tests are in tests/browser (see
# base.py there).
services:
  browser-integration:
    image: srfresh-browser:${SRFRESH_TAG:-local}
    build:
      context: ./tests/browser
      dockerfile: Dockerfile
    depends_on:
      app:
        condition: service_started
    environment:
      MM_BASE_URL: http://app:8080
      PGPASSWORD: test-password
    volumes:
      - ./tests/browser:/tests:ro
    # Chromium uses /dev/shm; the Docker default (64 MB) is too small.
    shm_size: 1gb
    networks: [isolated]
