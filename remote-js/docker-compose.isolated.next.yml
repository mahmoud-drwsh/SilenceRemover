# Next.js app override for the fresh isolated stack (spec #55, ticket #56).
# Apply it after docker-compose.isolated.fresh.yml. The runner
# (tests/integration/run_isolated_fresh.sh) adds it when MM_APP=next.
# The app, restore, and fixture services then use the new image that
# ../media-manager/Dockerfile builds:
#   - restore runs scripts/fresh-schema.ts (the app's schema bootstrap plus
#     the two test auth token rows).
#   - fixture runs make_fixtures.sh with the image's /bin/sh and ffmpeg. It
#     runs as root, because the image user cannot write to a new volume.
# SRFRESH_TAG sets the image tag, so that parallel worktrees do not replace
# the images of each other.
services:
  app:
    image: srfresh-media-manager-next:${SRFRESH_TAG:-local}
    build:
      context: ../media-manager
      dockerfile: Dockerfile

  restore:
    image: srfresh-media-manager-next:${SRFRESH_TAG:-local}
    build:
      context: ../media-manager
      dockerfile: Dockerfile
    volumes: !reset []
    entrypoint: ["node", "/app/scripts/fresh-schema.ts"]

  fixture:
    image: srfresh-media-manager-next:${SRFRESH_TAG:-local}
    build:
      context: ../media-manager
      dockerfile: Dockerfile
    user: "0"

  # The client contract steps that need routes of later tickets. A pending
  # step can fail. Remove a name when its ticket adds the route:
  # update_tags and delete_file (#59).
  client-contract-integration:
    environment:
      CONTRACT_PENDING_STEPS: update_tags,delete_file
