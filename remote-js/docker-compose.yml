services:
  media-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: media-manager:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - render
      - video
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_SCHEMA: ${DB_SCHEMA:-media_manager}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_BUCKET: ${S3_BUCKET:-media-manager}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-eu2}
      SOURCE_PROCESSING_WORKER_TOKEN: ${SOURCE_PROCESSING_WORKER_TOKEN}
      PORT: ${PORT:-8080}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  source-processor:
    build:
      context: ..
      dockerfile: remote-js/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      media-manager:
        condition: service_healthy
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - render
      - video
    environment:
      SOURCE_PROCESSING_SERVICE_URL: http://media-manager:8080
      SOURCE_PROCESSING_PROJECT: ${SOURCE_PROCESSING_PROJECT}
      SOURCE_PROCESSING_WORKER_TOKEN: ${SOURCE_PROCESSING_WORKER_TOKEN}
      SOURCE_PROCESSING_WORK_DIR: /work
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      SOURCE_PROCESSING_ENCODER: ${SOURCE_PROCESSING_ENCODER:-VAAPI}
      SOURCE_PROCESSING_ENABLE_TITLE_OVERLAY: ${SOURCE_PROCESSING_ENABLE_TITLE_OVERLAY:-true}
      SOURCE_PROCESSING_ENABLE_LOGO_OVERLAY: ${SOURCE_PROCESSING_ENABLE_LOGO_OVERLAY:-true}
    volumes:
      - source-processing-work:/work

volumes:
  source-processing-work:
