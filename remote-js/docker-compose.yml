services:
  media-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: media-manager:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL}
      SUPABASE_DB_SCHEMA: ${SUPABASE_DB_SCHEMA:-media_manager}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_BUCKET: ${S3_BUCKET:-media-manager}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-eu2}
      PORT: ${PORT:-8080}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
