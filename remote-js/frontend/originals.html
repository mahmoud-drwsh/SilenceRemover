<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Originals · Media Manager</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;background:#171717;color:#f5f5f5}.wrap{max-width:1100px;margin:auto;padding:1rem}.bar{display:flex;justify-content:space-between;align-items:center;gap:1rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}.card{background:#282828;border-radius:8px;padding:1rem}video{width:100%;max-height:240px;background:#000}a,button{color:#fff;background:#345fa8;border:0;border-radius:5px;padding:.55rem .8rem;text-decoration:none;cursor:pointer}.meta{color:#bbb;font-size:.9rem;margin:.5rem 0}.actions{display:flex;gap:.5rem;flex-wrap:wrap}.error{color:#ff9090}
  </style>
</head>
<body><main class="wrap"><div class="bar"><h1>Original recordings</h1><a href="./">Back to review</a></div><p class="meta">Private source files uploaded by the production pipeline.</p><div id="content">Loading…</div></main>
<script>
  const parts=location.pathname.split('/').filter(Boolean); const token=parts[1], project=parts[2];
  const base=`/projects/${encodeURIComponent(token)}/${encodeURIComponent(project)}`;
  const esc=(text)=>String(text??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const size=(n)=>n>1048576?`${(n/1048576).toFixed(1)} MiB`:`${Math.ceil(n/1024)} KiB`;
  async function download(id){const response=await fetch(`${base}/api/originals/${encodeURIComponent(id)}/download`);if(!response.ok)throw new Error('Download link unavailable');location.assign((await response.json()).url)}
  async function related(id, target){const response=await fetch(`${base}/api/originals/${encodeURIComponent(id)}/derived`);if(!response.ok)throw new Error('Related outputs unavailable');const items=await response.json();target.innerHTML=items.length?items.map(item=>`<a href="${base}/stream/${encodeURIComponent(item.id)}?type=${encodeURIComponent(item.type)}">Play ${esc(item.type)}: ${esc(item.title||item.id)}</a>`).join(' '):'No derived outputs yet.'}
  async function load(){const content=document.getElementById('content');try{const response=await fetch(`${base}/api/files?type=original`);if(!response.ok)throw new Error('Unable to load originals');const files=await response.json();if(!files.length){content.textContent='No originals have been uploaded yet.';return}content.className='grid';content.innerHTML=files.map(file=>`<article class="card"><video controls playsinline preload="metadata" src="${base}/stream/${encodeURIComponent(file.id)}?type=original"></video><h2>${esc(file.derived_title||file.original_filename||file.title||file.id)}</h2><div class="meta">${size(file.file_size)} · ${esc(file.mime_type)}</div><div class="actions"><button data-download-id="${esc(file.id)}">Download original</button><button data-related-id="${esc(file.id)}">Related outputs</button></div><div class="meta" data-related-for="${esc(file.id)}"></div></article>`).join('');content.querySelectorAll('button[data-download-id]').forEach(button=>button.addEventListener('click',()=>download(button.dataset.downloadId).catch(error=>alert(error.message))));content.querySelectorAll('button[data-related-id]').forEach(button=>button.addEventListener('click',()=>related(button.dataset.relatedId,content.querySelector(`[data-related-for="${CSS.escape(button.dataset.relatedId)}"]`)).catch(error=>alert(error.message))))}catch(error){content.className='error';content.textContent=error.message}}load();
</script></body></html>
