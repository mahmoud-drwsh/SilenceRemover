<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ready videos</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#667085; --line:#e5e7eb; --accent:#315efb; --soft:#f5f7fb; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; color:var(--ink); background:linear-gradient(135deg,#f9fbff 0%,#eef2ff 100%); }
    .shell { width:min(1180px,100%); margin:auto; padding:clamp(1.2rem,4vw,3.5rem) clamp(1rem,4vw,2rem); }
    .hero { display:flex; justify-content:space-between; gap:2rem; align-items:end; margin-bottom:2rem; }
    .eyebrow { color:var(--accent); font-size:.75rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    h1 { font-size:clamp(2rem,5vw,4rem); line-height:1; margin:.55rem 0 .8rem; letter-spacing:-.055em; }
    .intro { color:var(--muted); max-width:38rem; font-size:1.05rem; line-height:1.6; margin:0; }
    .count { flex:0 0 auto; background:#fff; border:1px solid var(--line); border-radius:1.25rem; padding:1rem 1.2rem; text-align:center; box-shadow:0 10px 30px #233b7d12; }
    .count strong { display:block; font-size:2rem; line-height:1; }
    .count span { display:block; color:var(--muted); font-size:.78rem; margin-top:.35rem; }
    .toolbar { display:flex; gap:.7rem; margin-bottom:1.4rem; }
    input { width:min(100%,27rem); border:1px solid var(--line); background:#fff; border-radius:.8rem; padding:.8rem 1rem; font:inherit; outline:none; }
    input:focus { border-color:var(--accent); box-shadow:0 0 0 3px #315efb20; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:1rem; }
    .card { background:#fff; border:1px solid var(--line); border-radius:1.15rem; overflow:hidden; box-shadow:0 12px 28px #233b7d0c; transition:transform .2s, box-shadow .2s; }
    .card:hover { transform:translateY(-3px); box-shadow:0 18px 36px #233b7d18; }
    .preview { aspect-ratio:16/9; background:#111827; position:relative; }
    video { width:100%; height:100%; object-fit:cover; display:block; }
    .body { padding:1rem; }
    .title { font-weight:750; line-height:1.35; min-height:2.7em; }
    .meta { color:var(--muted); font-size:.82rem; margin-top:.65rem; }
    .empty, .error { background:#fff; border:1px solid var(--line); border-radius:1rem; padding:2rem; text-align:center; color:var(--muted); }
    .error { color:#b42318; }
    @media (max-width:650px) { .hero { align-items:start; flex-direction:column; gap:1rem; } .count { width:100%; text-align:left; display:flex; align-items:center; gap:.8rem; } .count strong { font-size:1.5rem; } .count span { margin:0; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div><div class="eyebrow">Public collection</div><h1>Ready videos</h1><p class="intro">A view-only collection of published videos. No sign-in or editing access is required.</p></div>
      <div class="count"><strong id="count">—</strong><span>published videos</span></div>
    </section>
    <div class="toolbar"><input id="search" type="search" placeholder="Search videos…" aria-label="Search videos"></div>
    <section id="content" class="grid"><div class="empty">Loading videos…</div></section>
  </main>
  <script>
    const token = window.location.pathname.split('/').filter(Boolean)[1] || '';
    const content = document.getElementById('content');
    const count = document.getElementById('count');
    const search = document.getElementById('search');
    let videos = [];
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
    const formatDuration = (seconds) => { const s = Math.max(0, Math.round(Number(seconds) || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
    const formatDate = (value) => value ? new Date(value).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' }) : '';
    function render() {
      const query = search.value.trim().toLowerCase();
      const visible = videos.filter(v => !query || v.title.toLowerCase().includes(query));
      count.textContent = visible.length;
      content.className = visible.length ? 'grid' : '';
      content.innerHTML = visible.length ? visible.map(v => `<article class="card"><div class="preview"><video controls preload="metadata" playsinline src="${escapeHtml(v.stream_url)}"></video></div><div class="body"><div class="title">${escapeHtml(v.title)}</div><div class="meta">${formatDuration(v.duration)}${v.created_at ? ` · ${escapeHtml(formatDate(v.created_at))}` : ''}</div></div></article>`).join('') : `<div class="empty">${query ? 'No matching videos.' : 'No published videos yet.'}</div>`;
    }
    async function load() {
      try { const response = await fetch(`/public/${encodeURIComponent(token)}/api/videos`); if (!response.ok) throw new Error(response.status === 404 ? 'This share link is no longer available.' : 'Unable to load videos.'); const data = await response.json(); videos = data.videos || []; render(); }
      catch (error) { content.className = ''; content.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`; count.textContent = '—'; }
    }
    search.addEventListener('input', render); load();
  </script>
</body>
</html>
