pipeline:
  phase_0_trim_script_generation:
    skip_conditions:
      - condition: "trim script already generated"
        checked_path_templates:
          - "temp_dir/trim_scripts/{script_key}.ffscript"
        checked_runtime_templates:
          - "is_trim_script_ready(...) -> script file exists and load_trim_script(...) succeeds"
          - "load_trim_script(...) requires a non-empty filter graph body; strategy is inferred later from the graph plus current input/target context"
    robustness: "reasonable; readiness is file-based, invalidates on input identity plus trim-affecting params encoded in the script path, and requires one valid self-contained trim graph artifact"

  phase_1_snippet_creation:
    skip_conditions:
      - condition: "snippet already exists and is non-empty"
        checked_path_templates:
          - "temp_dir/snippet/{basename}.ogg"
        checked_runtime_templates:
          - "is_snippet_done(temp_dir, basename) -> path exists and stat().st_size > 0"
      - condition: "trim script missing (run phase 0 first)"
        checked_path_templates:
          - "temp_dir/trim_scripts/{script_key}.ffscript"
        checked_runtime_templates:
          - "is_trim_script_ready(...) is False"
          - "missing/invalid script means load_trim_script(...) cannot read a non-empty filter graph body"
    robustness: "good; snippet skip is content-aware enough for the generated audio artifact, and Phase 1 also hard-requires one structurally valid Phase 0 trim script"

  phase_2_transcription:
    skip_conditions:
      - condition: "transcript already exists and has non-whitespace UTF-8 content"
        checked_path_templates:
          - "temp_dir/transcript/{basename}.txt"
        checked_runtime_templates:
          - "is_transcript_done(temp_dir, basename) -> path exists and read_text(...).strip() is non-empty"
      - condition: "snippet missing or empty (run phase 1 first)"
        checked_path_templates:
          - "temp_dir/snippet/{basename}.ogg"
        checked_runtime_templates:
          - "is_snippet_done(temp_dir, basename) is False"
    robustness: "good; invalid UTF-8 or whitespace-only transcripts are treated as not done"
    concerns:
      - "in horizontal local mode with Media Manager configured, Phase 2 sends the snippet for transient server analysis and writes both the transcript and the title"

  phase_3_title_generation:
    skip_conditions:
      - condition: "title file already exists"
        checked_path_templates:
          - "temp_dir/title/{basename}.txt"
        checked_runtime_templates:
          - "is_title_done(temp_dir, basename) -> path.exists() only"
    robustness: "weak; skip logic is existence-only and does not validate non-empty title content"
    concerns:
      - "there is no skip-time check for transcript readiness here; phase execution relies on upstream ordering and the title generator itself"
      - "an empty or whitespace-only existing title file still counts as done for skip purposes"

  phase_4_original_upload:
    skip_conditions:
      - condition: "media manager disabled"
        checked_path_templates: []
        checked_runtime_templates:
          - "server_cache is None"
      - condition: "original already exists on server"
        checked_path_templates:
          - "server:original/{basename}"
        checked_runtime_templates:
          - "server_cache.has_original(\"{basename}\")"
    robustness: "good; the server-side source ID is the stable key, and every later remote artifact links to it"

  phase_5_audio_upload:
    skip_conditions:
      - condition: "media manager disabled"
        checked_path_templates: []
        checked_runtime_templates:
          - "server_cache is None"
      - condition: "audio marked trash on server"
        checked_path_templates: []
        checked_runtime_templates:
          - "server_cache.is_audio_trash(\"{basename}\")"
      - condition: "snippet/title missing (run phases 2-3 first)"
        checked_path_templates:
          - "temp_dir/snippet/{basename}.ogg"
          - "temp_dir/title/{basename}.txt"
        checked_runtime_templates:
          - "is_snippet_done(temp_dir, basename)"
          - "is_title_done(temp_dir, basename)"
      - condition: "audio already exists on server"
        checked_path_templates:
          - "server:audio/{basename}"
        checked_runtime_templates:
          - "server_cache.get_audio(\"{basename}\") is truthy"
    robustness: "reasonable, but title readiness is existence-only because it reuses is_title_done()"

  phase_8_final_encode:
    skip_conditions:
      - condition: "already completed"
        checked_path_templates:
          - "temp_dir/completed/{basename}.txt"
        checked_runtime_templates:
          - "is_completed(temp_dir, basename) -> completion marker exists only"
      - condition: "transcript missing (run phase 2 first)"
        checked_path_templates:
          - "temp_dir/transcript/{basename}.txt"
        checked_runtime_templates:
          - "is_transcript_done(temp_dir, basename)"
      - condition: "title missing (run phase 3 first)"
        checked_path_templates:
          - "temp_dir/title/{basename}.txt"
        checked_runtime_templates:
          - "is_title_done(temp_dir, basename)"
      - condition: "title empty"
        checked_path_templates:
          - "temp_dir/title/{basename}.txt"
        checked_runtime_templates:
          - "get_title_path(...).read_text(...).strip() == \"\""
      - condition: "trim script missing (run phase 0 first)"
        checked_path_templates:
          - "temp_dir/trim_scripts/{script_key}.ffscript"
        checked_runtime_templates:
          - "is_trim_script_ready(...) is False"
          - "missing/invalid script means load_trim_script(...) cannot read a non-empty filter graph body"
    robustness: "mixed; transcript/title emptiness is checked, but completion still trusts the marker file alone"
    concerns:
      - "completed skip does not verify that the referenced MP4 exists in output_dir"
      - "completed skip does not verify that completed.txt contains a non-empty output basename"
      - "Phase 0 may still resolve to a stream-copy path at runtime, so a ready trim script does not guarantee Phase 8 will run FFmpeg; the copy path still writes the title into the container metadata"
      - "Phase 8 makes only the no-overlay video; it adds no overlay graph, no logo, and no subtitle track"

  phase_12_no_overlay_upload:
    skip_conditions:
      - condition: "final encode not completed"
        checked_path_templates:
          - "temp_dir/completed/{basename}.txt"
        checked_runtime_templates:
          - "is_completed(temp_dir, basename) is False"
      - condition: "no-overlay encode missing"
        checked_path_templates:
          - "output_dir/{completed_output_filename}.mp4"
          - "output_dir/{sanitize_filename(title)}.mp4"
        checked_runtime_templates:
          - "get_completed_output_filename(temp_dir, basename), else sanitize_filename(local title)"
          - "the chosen MP4 path is not a file"
      - condition: "media manager disabled"
        checked_path_templates: []
        checked_runtime_templates:
          - "server_cache is None"
      - condition: "no-overlay video already exists on server"
        checked_path_templates:
          - "server:video/{basename}-no-overlay"
        checked_runtime_templates:
          - "server_cache.get_no_overlay_video(\"{basename}\") is truthy"
    robustness: "reasonable; the phase checks the local MP4 before upload and uses the server-side video ID as the skip key"
    concerns:
      - "the output filename falls back to sanitize_filename(title) when completed.txt is missing, unreadable, or empty"

  modes:
    media_manager_upload_only: "when MEDIA_MANAGER_URL is set and --local-title-and-trim-only is not set, the client runs one Original Upload phase (skip: original already exists on server) and stops; the server worker makes the review audio and the no-overlay video"
    horizontal_local_mode: "--local-title-and-trim-only runs phases 0, 1, 2, 3, 8 and does no Media Manager upload"
    no_media_manager: "without MEDIA_MANAGER_URL, phases 4, 5 and 12 are listed but skip with \"media manager disabled\" because server_cache is None"

summary:
  phases_1_to_2: "content-aware and fairly robust"
  phase_3: "weakest local skip because title readiness is path existence only"
  phases_4_and_5: "generally solid, with title checks still inheriting existence-only semantics where is_title_done() is used"
  phase_8: "brittle around completed.txt because completion is trusted without verifying the actual MP4"
  phase_12: "output-file resolution falls back from completed.txt to sanitize_filename(title)"
  media_manager_rule: "the client builds a server cache only for the Original Upload in media_manager_upload_only mode; other modes have no server cache"
